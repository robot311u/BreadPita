<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bread Pita — Greek Street Food, Stuttgart</title>
<style>
  :root{
    --blue-deep:#1B4A66;
    --cream:#E4F1F7;
    --olive:#74803F;
    --olive-dark:#4E5A29;
    --clay:#BE6A2E;
    --ink:#20241F;
    --ink-soft:#57594F;
    --white:#FFFFFF;
    --line:rgba(32,36,31,0.14);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Work Sans', -apple-system, sans-serif;
    --bg-page:var(--cream);
    --card-bg:var(--white);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-page:#15170F;
      --cream:#15170F;
      --card-bg:#1D2016;
      --ink:#EFEEE6;
      --ink-soft:#B9BBAE;
      --line:rgba(239,238,230,0.16);
    }
  }
  :root[data-theme="dark"]{
    --bg-page:#15170F;
    --cream:#15170F;
    --card-bg:#1D2016;
    --ink:#EFEEE6;
    --ink-soft:#B9BBAE;
    --line:rgba(239,238,230,0.16);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-page);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:480px;
    margin:0 auto;
    padding:28px 20px 40px;
  }

  header{
    text-align:center;
    margin-bottom:22px;
  }
  .wordmark{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:500;
    font-size:26px;
    color:var(--ink);
    margin:0 0 4px;
  }
  .tagline{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:0;
  }

  .slideshow{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:18px;
    overflow:hidden;
    background:var(--blue-deep);
  }
  .slide-track{
    display:flex;
    width:100%; height:100%;
    overflow-x:auto;
    overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .slide-track::-webkit-scrollbar{display:none;}
  .slide{
    flex:0 0 100%;
    scroll-snap-align:center;
    height:100%;
  }
  .slide img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }
  .dots{
    position:absolute; left:0; right:0; bottom:14px;
    display:flex; justify-content:center; gap:6px;
    pointer-events:none;
  }
  .dots span{
    width:6px; height:6px; border-radius:50%;
    background:rgba(255,255,255,0.55);
  }

  .actions{
    display:flex; flex-direction:column; gap:12px;
    margin-top:22px;
  }
  .action{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px;
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    text-decoration:none;
    color:var(--ink);
  }
  .action .left{display:flex; align-items:center; gap:14px;}
  .action .icon{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--cream);
    flex-shrink:0;
  }
  .action .icon svg{width:19px; height:19px;}
  .action .title{
    font-family:var(--font-display); font-size:18px; margin:0;
  }
  .action .sub{
    font-size:12.5px; color:var(--ink-soft); margin:2px 0 0;
  }
  .action .arrow{color:var(--clay); font-size:18px;}

  footer{
    margin-top:30px;
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  footer a{color:var(--ink-soft); text-decoration:underline;}

  .socials{
    display:flex; justify-content:center; gap:16px;
    margin-top:26px;
  }
  .socials a{
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--card-bg);
    border:1px solid var(--line);
    text-decoration:none;
  }
  .socials a svg{width:20px; height:20px;}
</style>
</head>
